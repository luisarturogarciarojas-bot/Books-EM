<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#733F1F"/>
      <stop offset="100%" stop-color="#472611"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background base for maskable and display -->
  <rect width="512" height="512" rx="110" fill="#FAF7F2"/>

  <!-- Outer subtle circular border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#E5DACB" stroke-width="4"/>

  <!-- Book icon container inside safe zone (central 80%) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Book cover back -->
    <rect x="-140" y="-170" width="280" height="330" rx="20" fill="url(#coverGrad)"/>
    
    <!-- Spine accent line -->
    <line x1="-105" y1="-170" x2="-105" y2="160" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Gold ornament frame on cover -->
    <rect x="-90" y="-140" width="205" height="270" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>

    <!-- Open book pages / Book silhouette -->
    <path d="M -70 -20 Q -25 -45 0 -20 Q 25 -45 70 -20 L 70 80 Q 25 55 0 80 Q -25 55 -70 80 Z" fill="#FFFDF9" stroke="#E5DACB" stroke-width="2"/>
    <path d="M 0 -20 L 0 80" stroke="#733F1F" stroke-width="3"/>
    
    <!-- Feather quill pen in gold -->
    <path d="M 45 -85 C 50 -105 70 -115 80 -120 C 78 -105 70 -85 55 -75 L -10 10 L -18 12 L -15 3 Z" fill="url(#goldGrad)"/>

    <!-- Bookmark ribbon hanging down -->
    <path d="M 15 80 L 15 130 L 30 115 L 45 130 L 45 80 Z" fill="#C2410C"/>

    <!-- Title typography text: EBOOK -->
    <text x="7" y="-55" font-family="serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">EBOOK</text>
  </g>
</svg>
